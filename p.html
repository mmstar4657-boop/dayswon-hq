<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1530">
<title>Proposal · DaysWon</title>
<meta property="og:title" content="Your proposal from DaysWon">
<meta property="og:description" content="Read it, download the PDF, and accept it online.">
<meta property="og:site_name" content="DaysWon">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="proposal.css?v=7">
<style>body{margin:0;background:#eceef2;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;color:#1b2540}
.wrap{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
.msg{background:#fff;border-radius:14px;padding:30px 22px;text-align:center;color:#4a536b}
.acc label{display:block;font-size:13px;font-weight:600;color:#66708a;margin:12px 0 5px}.acc input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d3d8e3;border-radius:10px;font:inherit;font-size:16px}
.acc .chk{display:flex;gap:10px;align-items:flex-start;color:#1b2540;font-size:15px;font-weight:400;margin-top:14px}.acc .chk input{width:20px;height:20px;margin-top:1px;flex:none}
.acc button,.dl{display:block;width:100%;box-sizing:border-box;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#0b1530;color:#fff;font:inherit;font-weight:700;font-size:16px;text-align:center;cursor:pointer}
.dl{background:#fff;color:#4f6bff;border:1px solid #d9def0;margin:14px 0 0;font-weight:600}.err{color:#c02a2f;margin-top:8px;font-size:14px}
.done{background:#e2f6ea;color:#0f5d2e;border-radius:12px;padding:14px}.note{background:#fff1dc;color:#7a4800;border-radius:12px;padding:14px}
@media (max-width:520px){.wrap{padding-left:0;padding-right:0;padding-top:0}.dl{margin:14px 16px 0;width:calc(100% - 32px)}}</style>
</head><body><div class="wrap" id="w"><div class="msg">Loading proposal…</div></div>
<script src="proposal-view.js?v=7"></script>
<script>
(function(){
const FN = "https://xgxswoaxalhdfjjxelyt.supabase.co/functions/v1/api", PK = "sb_publishable_O0fqxMtqt9gwXlNnHwTFCg_eGNQoo7W";
const tok = (location.hash || "").replace(/^#/, "").trim();
const w = document.getElementById("w"), H = DWView.H;
function msg(t){ w.innerHTML = '<div class="msg">' + H(t) + '</div>'; }
async function load(state){
  if (!/^[A-Za-z0-9_-]{32}$/.test(tok)) return msg("This link isn't complete. Please open the full link you were sent.");
  let r, d; try { r = await fetch(FN + "/public/" + tok, { headers: { apikey: PK } }); d = await r.json(); } catch (e) { return msg("We couldn't load this proposal. Please check your connection and try again."); }
  if (!r.ok || !d.ok) return msg(d.error || "This proposal link isn't valid anymore.");
  const P = d.p, biz = d.biz;
  document.title = (P.title || "Proposal") + " · Proposal for " + (P.company || P.client_name || "you") + " · DaysWon";
  let acc;
  if (P.status === "accepted") acc = '<div class="done">✓ Accepted by <b>' + H(P.accepted_name) + '</b>' + (P.accepted_company ? ", " + H(P.accepted_company) : "") + ' on ' + H(new Date(P.accepted_at).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })) + '.' + (state === "ok" ? '<br>Thank you! We\'ll be in touch about next steps.' : '') + '</div>';
  else if (P.status === "declined") acc = '<div class="note">This proposal is closed. Please get in touch if you\'d like to talk.</div>';
  else if (d.expired) acc = '<div class="note">This proposal expired on ' + H(DWView.fmtLong(P.valid_until)) + '. Please get in touch for an updated one.</div>';
  else acc = '<form class="acc" id="af"><p style="margin:0">To go ahead, type your name and tap Accept. This records your acceptance of this proposal and its terms' + (P.valid_until ? ' (valid until ' + H(DWView.fmtLong(P.valid_until)) + ')' : '') + '.</p>'
    + '<label for="an">Your full name</label><input type="text" id="an" required minlength="2" maxlength="120" autocomplete="name" value="' + H(P.client_name || "") + '">'
    + '<label for="ac">Company</label><input type="text" id="ac" maxlength="120" autocomplete="organization" value="' + H(P.company || "") + '">'
    + '<label class="chk"><input type="checkbox" id="ag"> I accept this proposal and its terms.</label><div class="err" id="ae"></div><button type="submit">Accept proposal</button></form>';
  w.innerHTML = DWView.html(P, biz, { accept: acc }) + '<button class="dl" id="dl">Download PDF</button>';
  const f = document.getElementById("af");
  if (f) f.onsubmit = async e => { e.preventDefault(); const ae = document.getElementById("ae"); ae.textContent = "";
    const name = document.getElementById("an").value.trim(), company = document.getElementById("ac").value.trim(), agree = document.getElementById("ag").checked;
    if (name.length < 2 || !agree) { ae.textContent = "Please type your full name and tick the box."; return; }
    const b = f.querySelector("button"); b.disabled = true; b.textContent = "Saving…";
    try { const r = await fetch(FN + "/public/" + tok + "/accept", { method: "POST", headers: { apikey: PK, "content-type": "application/json" }, body: JSON.stringify({ name, company, agree: true }) }); const d2 = await r.json();
      if (!r.ok || !d2.ok) throw new Error(d2.error || "Something went wrong."); await load("ok"); document.getElementById("accept").scrollIntoView({ behavior: "smooth" });
    } catch (x) { ae.textContent = x.message; b.disabled = false; b.textContent = "Accept proposal"; } };
  document.getElementById("dl").onclick = async () => { const b = document.getElementById("dl"); b.textContent = "Making PDF…";
    try { await new Promise((ok, no) => { if (window.PDFLib) return ok(); const s = document.createElement("script"); s.src = "pdf-lib.min.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      await new Promise((ok, no) => { if (window.DWPdf) return ok(); const s = document.createElement("script"); s.src = "proposal-pdf.js?v=7"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      await DWPdf.share(P, biz, false); } catch (e) { alert("Couldn't make the PDF. Please try again."); } b.textContent = "Download PDF"; };
}
load("");
})();
</script></body></html>
